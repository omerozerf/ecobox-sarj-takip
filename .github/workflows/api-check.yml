name: api-check

# Manual probe: does the Ecobox status endpoint answer a GitHub-hosted runner?
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Poll once without storing
        run: python -m ecobox poll-once --no-store
