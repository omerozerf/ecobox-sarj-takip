name: site

# Builds the public page and deploys it to GitHub Pages: the static files under `site/` plus a
# `data.json` computed from the snapshots on the `data` branch. The page reads the live status
# straight from that branch, so this only has to run as often as the statistics should move.
#
# Pushes made by the collector do not start workflows, and `schedule` has failed in this
# repository before, so the `collect` loop dispatches this about once an hour.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A newer build waits for the running deploy instead of cutting it off half way.
concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: code
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: code/requirements.txt
      - run: pip install -r code/requirements.txt
      - name: Build the page
        run: |
          mkdir out
          cp -R code/site/. out/
          cd code
          python -m ecobox site-data --snapshots ../data/snapshots --out ../out/data.json \
            --snapshot-base-url "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/data/snapshots"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
