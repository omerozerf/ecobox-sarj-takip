name: collect

# Records one status snapshot of every Ecobox connector to the `data` branch, so history
# keeps growing while the machine running the full recorder is asleep.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: code
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Append snapshot
        working-directory: code
        run: python -m ecobox.snapshot ../data/snapshots
      - name: Commit and push
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshots
          git commit -q -m "data: snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q
