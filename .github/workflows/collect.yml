name: collect

# Records a status snapshot of every Ecobox connector to the `data` branch every three
# minutes, so history keeps growing while the machine running the full recorder is asleep.
#
# GitHub's `schedule` trigger never fired for this repository, so the collector does not
# depend on it: one run polls in a loop for about five and a half hours and then starts its
# successor. `watchdog.yml` restarts the chain if it ever breaks. Cancel a run to stop it.
on:
  workflow_dispatch:
    inputs:
      loop_seconds:
        description: How long this run polls before handing over (shorten to test the handover)
        default: "19800"

permissions:
  contents: write
  actions: write

# A successor waits here until the current run has finished.
concurrency:
  group: collect
  cancel-in-progress: false

env:
  LOOP_SECONDS: ${{ inputs.loop_seconds }}
  POLL_SECONDS: 180
  SITE_EVERY_ROUNDS: 20

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          path: code
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data
          # Two commits deep: amending today's commit needs its parent in the checkout. At the
          # default depth of one the parent is cut off and the amend comes out as a root
          # commit, which the force-push then made the whole history.
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Poll and push until the time budget is used
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git -C data config user.name "github-actions[bot]"
          git -C data config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          round=0
          while [ "$SECONDS" -lt "$LOOP_SECONDS" ]; do
            started=$SECONDS
            # The page's statistics are rebuilt about once an hour; a failed dispatch costs
            # one rebuild and never the poll.
            round=$(( round + 1 ))
            if [ $(( round % SITE_EVERY_ROUNDS )) -eq 0 ]; then
              gh workflow run site.yml --repo "$GITHUB_REPOSITORY" --ref main \
                || echo "::warning::site rebuild was not started"
            fi
            # A failed poll or push costs one sample; the next round carries on.
            # One commit per UTC day, matching the day files: each poll of the day amends
            # that commit and force-pushes it, so the files stay current for the page while
            # the branch gains one commit a day instead of 480. The lease only lets a push
            # replace the commit this checkout last saw on the remote.
            if (cd code && python -m ecobox.snapshot ../data/snapshots); then
              git -C data add snapshots
              message="data: snapshots $(date -u +%Y-%m-%d)"
              if [ "$(git -C data log -1 --format=%s)" = "$message" ]; then
                git -C data commit -q --amend --no-edit
                git -C data push -q --force-with-lease \
                  || echo "::warning::push failed, retrying with the next snapshot"
              else
                git -C data commit -q -m "$message"
                git -C data push -q || echo "::warning::push failed, retrying with the next snapshot"
              fi
            else
              echo "::warning::poll failed"
            fi
            rest=$(( POLL_SECONDS - (SECONDS - started) ))
            if [ "$rest" -gt 0 ]; then sleep "$rest"; fi
          done
      - name: Start the successor
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          # After a failure wait first, so a run that breaks at once cannot respawn in a tight loop.
          if [ "$JOB_STATUS" != "success" ]; then sleep 300; fi
          gh workflow run collect.yml --repo "$GITHUB_REPOSITORY" --ref main
